name: Docker Build and Push


on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: mtechproject.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}


    - name: Build Backend Image
      run: |
        docker build \
        -t mtechproject.azurecr.io/user-registration-backend:latest \
        ./backend


    - name: Push Backend Image
      run: |
        docker push \
        mtechproject.azurecr.io/user-registration-backend:latest


    - name: Build Frontend Image
      run: |
        docker build \
        -t mtechproject.azurecr.io/user-registration-frontend:latest \
        ./frontend


    - name: Push Frontend Image
      run: |
        docker push \
        mtechproject.azurecr.io/user-registration-frontend:latest